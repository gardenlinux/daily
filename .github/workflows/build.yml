name: Build and Deploy Dashboard

on:
    push:
        branches: [gh-pages, packages]
    pull_request:
        branches: [gh-pages]
    workflow_dispatch:
    workflow_run:
        workflows: ["aggregate_package_states.yml"]
        types: [completed]

jobs:
    build:
        runs-on: ubuntu-latest
        # Only run if it's not a workflow_run trigger, or if it is a workflow_run trigger and the previous workflow succeeded
        if: >
            github.event_name != 'workflow_run' ||
            (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build dashboard
              run: |
                  npm run packages
                  npm run build
              env:
                  NODE_ENV: production

            - name: List build output
              run: |
                  echo "Build completed. Output files:"
                  ls -la dist/

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: dashboard-build
                  path: |
                      index.html
                      style.css
                      dist/
                  retention-days: 30

            - name: Setup Pages (if deploying to GitHub Pages)
              uses: actions/configure-pages@v5

            - name: Upload to GitHub Pages
              uses: actions/upload-pages-artifact@v3
              with:
                  path: "."

    deploy:
        needs: build
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request'

        permissions:
            pages: write
            id-token: write

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
